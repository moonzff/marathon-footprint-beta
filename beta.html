    async function fetchRemoteState() {
      const response = await fetch(API_URL, { headers: { "accept": "application/json" } });
      if (!response.ok) throw new Error(`api_${response.status}`);
      return response.json();
    }

    function localState() {
      try {
        const stored = localStorage.getItem(LOCAL_KEY);
        return stored ? JSON.parse(stored) : null;
      } catch {
        return null;
      }
    }

    function saveLocal() {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
    }

    function mergeById(remoteList = [], localList = [], deletedIds = new Set()) {
      const merged = new Map();
      remoteList.forEach(item => {
        if (!deletedIds.has(item.id)) merged.set(item.id, item);
      });
      localList.forEach(item => {
        if (!deletedIds.has(item.id)) merged.set(item.id, item);
      });
      return [...merged.values()];
    }

    function mergeStates(remote, local) {
      if (!remote) return local;
      const deletedIds = new Set([...(remote.deletedResultIds || []), ...(local.deletedResultIds || [])]);
      return normalizeBetaState({
        ...remote,
        ...local,
        deletedResultIds: [...deletedIds],
        events: mergeById(remote.events, local.events),
        users: mergeById(remote.users, local.users),
        results: mergeById(remote.results, local.results, deletedIds),
        posts: mergeById(remote.posts, local.posts),
        feedback: mergeById(remote.feedback, local.feedback)
      });
    }

    async function persist() {
      db.savedAt = new Date().toISOString();
      saveLocal();
      try {
        const latest = await fetchRemoteState();
        const merged = mergeStates(latest.state, db);
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "replace", state: merged })
        });
        if (!response.ok) throw new Error(`save_${response.status}`);
        const payload = await response.json();
        db = payload.state || merged;
        state.storageMode = "shared";
        saveLocal();
      } catch {
        state.storageMode = "local";
      }
    }

    function parseTime(value) {
      const parts = String(value).trim().split(":").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return parts[0] * 3600 + parts[1] * 60 + parts[2];
    }

    async function bootstrap() {
      state.view = "loading";
      render();
      try {
        const remote = await fetchRemoteState();
        if (remote.state) {
          db = normalizeBetaState(remote.state);
          state.storageMode = "shared";
        } else {
          db = normalizeBetaState(localState() || generateSeed());
          state.storageMode = "shared";
          await persist();
        }
      } catch {
        db = normalizeBetaState(localState() || generateSeed());
        state.storageMode = "local";
      }
      saveLocal();
      const session = localStorage.getItem(SESSION_KEY);
      if (session && db.users.some(user => user.id === session)) state.currentUserId = session;
      const path = window.location.pathname;
      const publicMatch = path.match(/^\/u\/([^/]+)/);
      if (publicMatch) {
        const publicUser = db.users.find(user => user.slug === publicMatch[1]);
        if (publicUser) state.publicUserId = publicUser.id;
      }
      state.view = state.currentUserId ? "passport" : "register";
      render();
    }

    document.addEventListener("submit", async event => {
      const form = event.target.closest("form");
      if (!form) return;
      event.preventDefault();
      const values = Object.fromEntries(new FormData(form).entries());

      if (form.dataset.form === "register") {
        const code = String(values.invite || "").trim().toUpperCase();
        if (!INVITE_CODES.includes(code)) {
          showToast("邀请码不对，先用 RUN2026");
          return;
        }
        const nickname = String(values.nickname || "").trim();
        if (!nickname) {
          showToast("先填一个跑者昵称");
          return;
        }
        if (!values.gender || !values.birthDate) {
          showToast("性别和出生日期用于自动计算大众等级");
          return;
        }
        const user = {
          id: uid("real_user"),
          slug: `${nickname.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-")}-${Math.random().toString(36).slice(2, 6)}`,
          nickname,
          homeCity: String(values.homeCity || "武汉").trim(),
          gender: String(values.gender || "").trim(),
          birthDate: String(values.birthDate || "").trim(),
          runningYears: Number(values.runningYears || 1),
          motto: String(values.motto || "每一场完赛，都值得被记住").trim(),
          publicProfile: true,
          synthetic: false,
          createdAt: new Date().toISOString()
        };
        db.users.unshift(user);
        state.currentUserId = user.id;
        localStorage.setItem(SESSION_KEY, user.id);
        persist();
        showToast("护照已建立");
        navigate("passport", { push: false });
        return;
      }

      if (!state.currentUserId) return;

      if (form.dataset.form === "settings") {
        const user = getCurrentUser();
        user.nickname = String(values.nickname || user.nickname).trim();
        user.homeCity = String(values.homeCity || user.homeCity).trim();
        user.gender = String(values.gender || "").trim();
        user.birthDate = String(values.birthDate || "").trim();
        user.runningYears = Number(values.runningYears || user.runningYears);
        user.motto = String(values.motto || "").trim();
        user.publicProfile = values.publicProfile === "true";
        persist();
        showToast("档案已保存");
        navigate("profile");
        return;
      }

      if (form.dataset.form === "result") {
        if (form.dataset.saving === "true") {
          showToast("正在保存，请稍候");
          return;
        }
        form.dataset.saving = "true";
        try {
          if (values.ocrStatus === "reading") {
            showToast("成绩单仍在识别，请稍后再保存");
            return;
          }
          const hasScoreFile = Boolean(form.querySelector("[data-score-file]")?.files?.length);
          if (hasScoreFile && values.ocrStatus !== "verified" && values.manualConfirmed !== "true") {
            showToast("OCR 未确认赛事，请手动选择赛事后再保存");
            return;
          }
          const typedEvent = findEventFromText(values.eventQuery);
          const eventInfo = typedEvent || db.events.find(item => item.id === values.eventId) || db.events[0];
          const seconds = parseTime(values.time);
          if (!seconds) {
            showToast("成绩格式请写成 3:28:15");
            return;
          }
          const distance = String(values.distance || eventInfo.distance);
          const km = distance === "半马" ? 21.0975 : 42.195;
          const editingIndex = values.resultId ? db.results.findIndex(item => item.id === values.resultId) : -1;
          const existingResult = editingIndex >= 0 ? db.results[editingIndex] : null;
          const candidate = {
            userId: state.currentUserId,
            eventId: eventInfo.id,
            eventName: eventInfo.name,
            city: eventInfo.city,
            date: eventInfo.date,
            distance,
            time: secondsToTime(seconds),
            bibNumber: String(values.bibNumber || "").trim()
          };
          const duplicateIndex = existingResult ? -1 : findDuplicateResultIndex(candidate);
          const duplicateResult = duplicateIndex >= 0 ? db.results[duplicateIndex] : null;
          const targetIndex = existingResult ? editingIndex : duplicateIndex;
          const targetResult = existingResult || duplicateResult;
          const previousBest = bestResult(userResults().filter(item => item.id !== targetResult?.id), distance);
          const calculatedLevel = roadLevelFor(seconds, distance, getCurrentUser(), eventInfo.date);
          const assetRead = await readResultAssets(form, targetResult?.assets || {});
          const resultAssets = assetRead.assets || {};
          const mergedAssets = Object.keys(resultAssets).length ? { ...(targetResult?.assets || {}), ...resultAssets } : (targetResult?.assets || {});
          const result = {
            id: targetResult?.id || uid("real_result"),
            userId: state.currentUserId,
            eventId: eventInfo.id,
            eventName: eventInfo.name,
            city: eventInfo.city,
            date: eventInfo.date,
            distance,
            seconds,
            time: secondsToTime(seconds),
            pace: pace(seconds, km),
            rank: String(values.rank || `- / ${eventInfo.capacity}`),
            genderRank: String(values.genderRank || "-"),
            ageRank: String(values.ageRank || "-"),
            runnerGoal: String(values.runnerGoal || targetResult?.runnerGoal || "pb"),
            runnerStyle: String(values.runnerStyle || targetResult?.runnerStyle || "zen"),
            bibNumber: String(values.bibNumber || "").trim(),
            elevationGain: String(values.elevationGain || "").trim().replace(/[^\d.]/g, ""),
            photoAlbumUrl: String(values.photoAlbumUrl || "").trim(),
            level: calculatedLevel,
            official: values.official === "true",
            pb: !previousBest || seconds < previousBest.seconds,
            medal: targetResult?.medal || "gold",
            source: values.ocrStatus === "verified" ? "ocr" : "manual",
            assets: mergedAssets,
            note: String(values.note || "").trim(),
            synthetic: false,
            createdAt: targetResult?.createdAt || new Date().toISOString(),
            updatedAt: targetResult ? new Date().toISOString() : undefined
          };
          if (targetResult) {
            db.results.splice(targetIndex, 1, result);
          } else {
            db.results.unshift(result);
          }
          state.selectedEventId = result.eventId;
          state.selectedResultId = result.id;
          state.editingResultId = null;
          state.reportOcrStatus = "idle";
          state.reportOcrMessage = "先上传成绩单截图；系统会读取赛事、成绩和排名，下面字段只做校对补充。";
          state.reportManualConfirmed = false;
          persist();
          showToast(existingResult ? "赛事档案已更新" : duplicateResult ? "已更新同场完赛档案" : "已保存到纪念册");
          navigate("archive");
          startRunnerPhotoCutout(result.id, assetRead.cutoutJobs);
          return;
        } finally {
          form.dataset.saving = "";
        }
      }

      if (form.dataset.form === "post") {
        const content = String(values.content || "").trim();
        if (!content) return;
        db.posts.unshift({
          id: uid("real_post"),
          userId: state.currentUserId,
          eventId: state.selectedEventId,
          topic: state.feedTab === "all" ? "pb" : state.feedTab,
          content,
          likes: 0,
          comments: 0,
          synthetic: false,
          createdAt: new Date().toISOString()
        });
        form.reset();
        persist();
        showToast("已发布到同场话题");
        render();
        return;
      }

      if (form.dataset.form === "feedback") {
        const content = String(values.content || "").trim();
        if (!content) return;
        db.feedback.unshift({
          id: uid("real_feedback"),
          userId: state.currentUserId,
          type: String(values.type || "体验问题"),
          content,
          synthetic: false,
          createdAt: new Date().toISOString()
        });
        persist();
        showToast("反馈已提交");
        navigate("profile");
      }
    });

    document.addEventListener("change", event => {
      const birthSelect = event.target.closest("[data-birth-year], [data-birth-month], [data-birth-day]");
      if (birthSelect) {
        updateBirthDateField(birthSelect.closest("[data-birth-field]"));
        return;
      }
      const eventSelect = event.target.closest("[data-select-event]");
      if (eventSelect) {
        state.selectedEventId = eventSelect.value;
        render();
        return;
      }
      const resultEvent = event.target.closest("[data-result-event]");
      if (resultEvent) {
        const form = resultEvent.closest("form");
        const eventInfo = db.events.find(item => item.id === resultEvent.value);
        state.reportTouched = true;
        markReportManualConfirmed(form);
        applyEventToReportForm(form, eventInfo);
        return;
      }
      const levelInput = event.target.closest("[data-level-input]");
      if (levelInput) {
        updateLevelFromForm(levelInput.closest("form"));
        return;
      }
      const scoreFile = event.target.closest("[data-score-file]");
      if (scoreFile && scoreFile.files.length) {
        const form = scoreFile.closest("form");
        extractResultFromImage(scoreFile.files[0], form);
      }
    });

    document.addEventListener("input", event => {
      const manualField = event.target.closest("[data-result-manual]");
      if (manualField) markReportManualConfirmed(manualField.closest("form"));
      const levelInput = event.target.closest("[data-level-input]");
      if (levelInput) updateLevelFromForm(levelInput.closest("form"));
      const query = event.target.closest("[data-event-query]");
      if (!query) return;
      state.reportTouched = true;
      const matched = findEventFromText(query.value);
      if (!matched || matched.id === state.selectedEventId) return;
      const form = query.closest("form");
      state.selectedEventId = matched.id;
      if (form?.eventId) form.eventId.value = matched.id;
      if (form?.distance) form.distance.value = matched.distance;
      updateLevelFromForm(form);
    });

    document.addEventListener("click", async event => {
      const tabButton = event.target.closest("[data-tab]");
      if (tabButton) {
        state.history = [];
        navigate(tabButton.dataset.tab);
        return;
      }
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        if (viewButton.dataset.resultId) state.selectedResultId = viewButton.dataset.resultId;
        if (viewButton.dataset.view === "report") {
          state.editingResultId = null;
          state.reportManualConfirmed = false;
          state.reportOcrStatus = "idle";
          state.reportOcrMessage = "先上传成绩单截图；系统会读取赛事、成绩和排名，下面字段只做校对补充。";
        }
        navigate(viewButton.dataset.view);
        return;
      }
      const mapFilter = event.target.closest("[data-map-filter]");
      if (mapFilter) {
        state.mapFilter = mapFilter.dataset.mapFilter;
        render();
        return;
      }
      const archiveFilter = event.target.closest("[data-archive-filter]");
      if (archiveFilter) {
        state.archiveFilter = archiveFilter.dataset.archiveFilter;
        render();
        return;
      }
      const feedTab = event.target.closest("[data-feed-tab]");
      if (feedTab) {
        state.feedTab = feedTab.dataset.feedTab;
        render();
        return;
      }
      const posterMode = event.target.closest("[data-poster-mode]");
      if (posterMode) {
        state.posterMode = posterMode.dataset.posterMode;
        render();
        showToast(`已切换到${posterMode.textContent.trim()}模板`);
        return;
      }
      const action = event.target.closest("[data-action]");
      if (!action) return;
      const type = action.dataset.action;
      if (type === "quick-feedback") {
        if (state.currentUserId) navigate("feedback");
        return;
      }
      if (type === "share-profile") {
        const user = getCurrentUser();
        const url = `${window.location.origin}/u/${user.slug}`;
        try {
          await navigator.clipboard.writeText(url);
          showToast("分享链接已复制");
        } catch {
          showToast(url);
        }
        return;
      }
      if (type === "save-poster") {
        try {
          await downloadPosterPreview();
          showToast("已保存海报图片");
        } catch {
          showToast("海报保存失败，请先截图预览区");
        }
        return;
      }
      if (type === "edit-result") {
        const result = db.results.find(item => item.id === action.dataset.resultId);
        if (!result) return;
        state.editingResultId = result.id;
        state.selectedResultId = result.id;
        state.selectedEventId = result.eventId;
        state.reportManualConfirmed = true;
        navigate("report");
        return;
      }
      if (type === "delete-result") {
        const result = db.results.find(item => item.id === action.dataset.resultId);
        if (!result) return;
        if (!window.confirm(`删除「${result.eventName}」这条完赛档案？`)) return;
        db.results = db.results.filter(item => item.id !== result.id);
        db.deletedResultIds = [...new Set([...(db.deletedResultIds || []), result.id])];
        state.selectedResultId = null;
        state.editingResultId = null;
        persist();
        showToast("赛事档案已删除");
        navigate("archive", { push: false });
        return;
      }
      if (type === "reset-local") {
        localStorage.removeItem(LOCAL_KEY);
        localStorage.removeItem(SESSION_KEY);
        db = normalizeBetaState(generateSeed());
        state.currentUserId = null;
        state.storageMode = "local";
        state.posterMode = "auto";
        saveLocal();
        showToast("本机数据已重置");
        navigate("register", { push: false });
      }
    });

    backBtn.addEventListener("click", goBack);
    screen.addEventListener("scroll", () => topbar.classList.toggle("is-raised", screen.scrollTop > 8));
    window.addEventListener("leaflet-ready", () => {
      if (state.view === "map") initMap();
    });

    bootstrap();
  </script>
</body>
</html>
