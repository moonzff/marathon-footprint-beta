<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>马拉松电子纪念册 Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050706;
      --panel: #0d1210;
      --panel-2: #121916;
      --panel-3: #17201c;
      --line: rgba(255, 255, 255, 0.09);
      --text: #f6f1e8;
      --muted: #9ca79f;
      --weak: #68736c;
      --orange: #f36a17;
      --orange-2: #ff8b35;
      --gold: #dbb171;
      --blue: #4b95ff;
      --green: #35c875;
      --danger: #e85a4f;
      --radius: 8px;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.44);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 16% 0%, rgba(243, 106, 23, 0.18), transparent 28rem),
        radial-gradient(circle at 90% 12%, rgba(75, 149, 255, 0.10), transparent 24rem),
        #020302;
      color: var(--text);
    }

    body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      width: min(100%, 430px);
      margin: 0 auto;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 16rem),
        var(--bg);
      box-shadow: var(--shadow);
    }

    @media (min-width: 700px) {
      body {
        padding: 18px 0;
      }

      .app {
        min-height: calc(100svh - 36px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
      }
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: calc(54px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 10px 0;
      background: rgba(5, 7, 6, 0.82);
      border-bottom: 1px solid transparent;
      backdrop-filter: blur(18px);
    }

    .topbar.is-raised {
      border-bottom-color: rgba(255, 255, 255, 0.08);
    }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      color: var(--text);
    }

    .icon-btn:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .back-btn[hidden] {
      display: inline-grid;
      visibility: hidden;
      pointer-events: none;
    }

    .titlebox {
      min-width: 0;
      text-align: center;
      line-height: 1.25;
    }

    .titlebox b {
      display: block;
      overflow: hidden;
      font-size: 16px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .titlebox span {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .screen {
      flex: 1;
      min-height: 0;
      padding: 14px 14px 94px;
      overflow: auto;
      overscroll-behavior-y: contain;
    }

    .tabbar {
      position: fixed;
      right: max(0px, calc((100vw - 430px) / 2));
      bottom: 0;
      left: max(0px, calc((100vw - 430px) / 2));
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(9, 12, 11, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
    }

    .tabbar button {
      display: grid;
      justify-items: center;
      gap: 4px;
      min-width: 0;
      padding: 6px 2px 4px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .tabbar button::before {
      content: "";
      width: 20px;
      height: 20px;
      border: 2px solid currentColor;
      border-radius: 7px;
      opacity: 0.72;
    }

    .tabbar button[data-tab="map"]::before {
      border-radius: 999px;
    }

    .tabbar button[data-tab="archive"]::before {
      width: 18px;
      border-radius: 4px;
      box-shadow: inset 0 5px 0 rgba(255, 255, 255, 0.16);
    }

    .tabbar button[data-tab="community"]::before {
      border-radius: 999px 999px 999px 4px;
    }

    .tabbar button[data-tab="profile"]::before {
      width: 18px;
      border-radius: 999px 999px 7px 7px;
    }

    .tabbar button.is-active {
      color: var(--orange);
      background: rgba(243, 106, 23, 0.09);
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 0;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02)),
        var(--panel);
    }

    .soft-card {
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.035);
    }

    .hero-card {
      position: relative;
      min-height: 178px;
      padding: 18px 16px 16px;
      background:
        linear-gradient(100deg, rgba(5, 7, 6, 0.94) 0%, rgba(5, 7, 6, 0.72) 52%, rgba(5, 7, 6, 0.18)),
        linear-gradient(135deg, rgba(37, 55, 48, 0.95), rgba(8, 12, 11, 0.96));
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -36px;
      bottom: -38px;
      width: 185px;
      height: 185px;
      border: 2px solid rgba(219, 177, 113, 0.26);
      border-radius: 999px;
      background:
        radial-gradient(circle, transparent 48%, rgba(219, 177, 113, 0.18) 49%, transparent 51%),
        repeating-conic-gradient(from -18deg, rgba(219, 177, 113, 0.22) 0deg 7deg, transparent 7deg 15deg);
      opacity: 0.68;
      transform: rotate(-14deg);
    }

    .runner-head {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background:
        linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.12)),
        url("assets/memorial-ui-01-passport-home.jpg") center 10% / 285% auto;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .runner-head h1,
    .public-card h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
    }

    .runner-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag,
    .mini-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tag {
      padding: 5px 9px;
      background: rgba(255, 255, 255, 0.08);
      color: #e7ded0;
      font-size: 12px;
    }

    .tag.orange {
      background: rgba(243, 106, 23, 0.16);
      color: #ff9c56;
    }

    .tag.blue {
      background: rgba(75, 149, 255, 0.16);
      color: #91bfff;
    }

    .tag.green {
      background: rgba(53, 200, 117, 0.14);
      color: #7be0a6;
    }

    .tag.gold {
      background: rgba(219, 177, 113, 0.16);
      color: #f1ca8e;
    }

    .passport-stats {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.16);
    }

    .passport-stats div {
      min-width: 0;
      padding: 12px 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .passport-stats div:last-child {
      border-right: 0;
    }

    .passport-stats b {
      display: block;
      overflow-wrap: anywhere;
      color: var(--gold);
      font-size: 21px;
      line-height: 1.1;
    }

    .passport-stats span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-card {
      padding: 14px;
    }

    .metric-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-card b {
      display: block;
      margin-top: 5px;
      color: var(--orange);
      font-size: 29px;
      line-height: 1;
    }

    .metric-card small {
      display: block;
      margin-top: 7px;
      color: #b7c0b9;
      font-size: 12px;
    }

    .race-card {
      display: grid;
      grid-template-columns: 1fr 78px;
      gap: 12px;
      padding: 13px;
      text-align: left;
      width: 100%;
    }

    .race-card h3,
    .race-row h3,
    .feed-card h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    .race-card p,
    .race-row p,
    .feed-card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .race-time {
      margin-top: 8px;
      color: var(--orange);
      font-size: 24px;
      font-weight: 850;
      line-height: 1;
    }

    .medal {
      align-self: center;
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.45), transparent 16%),
        radial-gradient(circle at 50% 56%, #a77939 0 32%, #5a351b 33% 36%, #d4a45e 37% 56%, #7b4d24 58% 100%);
      box-shadow: inset 0 0 0 4px rgba(255, 231, 180, 0.18), 0 10px 24px rgba(0, 0, 0, 0.34);
    }

    .medal.silver {
      filter: grayscale(0.9) brightness(1.16);
    }

    .medal.small {
      width: 54px;
      height: 54px;
    }

    .medal.ribbon::before {
      content: "";
      display: block;
      width: 24px;
      height: 22px;
      margin: -18px auto 0;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(90deg, #cf5a28 0 34%, #2d6cbd 34% 66%, #cf5a28 66%);
    }

    .primary-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .action-btn,
    .ghost-btn,
    .solid-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 14px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 700;
    }

    .action-btn,
    .solid-btn {
      background: linear-gradient(135deg, var(--orange), #f47f1d);
      color: #fff7ed;
      box-shadow: 0 10px 26px rgba(243, 106, 23, 0.22);
    }

    .ghost-btn {
      border: 1px solid rgba(243, 106, 23, 0.45);
      color: #ff9d55;
      background: rgba(243, 106, 23, 0.08);
    }

    .h-scroll {
      display: grid;
      grid-auto-columns: minmax(126px, 40%);
      grid-auto-flow: column;
      gap: 10px;
      margin: 0 -14px;
      padding: 0 14px 2px;
      overflow-x: auto;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .h-scroll::-webkit-scrollbar {
      display: none;
    }

    .city-tile,
    .mini-race {
      scroll-snap-align: start;
      min-height: 116px;
      padding: 12px;
      text-align: left;
    }

    .mini-race {
      display: grid;
      align-content: end;
      position: relative;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.72)),
        linear-gradient(135deg, #293931, #0a0d0c);
    }

    .mini-race::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background: var(--bg-image, none) center / cover;
    }

    .mini-race > * {
      position: relative;
      z-index: 1;
    }

    .mini-race b,
    .city-tile b {
      display: block;
      font-size: 15px;
      line-height: 1.2;
    }

    .mini-race span,
    .city-tile span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      font-size: 13px;
      white-space: nowrap;
    }

    .chip.is-active {
      border-color: rgba(243, 106, 23, 0.55);
      color: #fff;
      background: rgba(243, 106, 23, 0.18);
    }

    .map-card {
      position: relative;
      padding: 8px;
      background:
        radial-gradient(circle at 58% 50%, rgba(243, 106, 23, 0.12), transparent 8rem),
        radial-gradient(circle at 42% 56%, rgba(75, 149, 255, 0.12), transparent 9rem),
        #07100f;
    }

    .interactive-map {
      position: relative;
      height: min(68svh, 420px);
      min-height: 330px;
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        #07110f;
      background-size: 28px 28px;
      isolation: isolate;
    }

    .interactive-map::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 500;
      pointer-events: none;
      background:
        radial-gradient(circle at 72% 42%, rgba(243, 106, 23, 0.16), transparent 8rem),
        linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.24));
      mix-blend-mode: screen;
      opacity: 0.65;
    }

    .leaflet-container {
      font: inherit;
      background: #07110f;
    }

    .leaflet-control-zoom {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 8px !important;
      background: rgba(8, 12, 11, 0.82);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(16px);
    }

    .leaflet-control-zoom a {
      width: 34px !important;
      height: 34px !important;
      border: 0 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10) !important;
      color: #f4efe7 !important;
      background: rgba(255, 255, 255, 0.04) !important;
      line-height: 34px !important;
    }

    .leaflet-control-zoom a:last-child {
      border-bottom: 0 !important;
    }

    .leaflet-control-attribution {
      max-width: 210px;
      border-radius: 999px 0 0 0;
      background: rgba(5, 7, 6, 0.68) !important;
      color: rgba(255, 255, 255, 0.56) !important;
      font-size: 9px;
    }

    .leaflet-control-attribution a {
      color: rgba(255, 255, 255, 0.72) !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(12, 17, 15, 0.94);
      color: var(--text);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.42);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      backdrop-filter: blur(16px);
    }

    .leaflet-popup-content {
      margin: 12px 13px;
      min-width: 150px;
    }

    .leaflet-popup-close-button {
      color: rgba(255, 255, 255, 0.58) !important;
    }

    .map-popup h3 {
      margin: 0;
      font-size: 15px;
    }

    .map-popup p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .map-popup b {
      color: var(--orange);
      font-size: 18px;
    }

    .footprint-marker {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--marker-size);
      height: var(--marker-size);
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      background: var(--marker-color);
      box-shadow:
        0 0 0 8px color-mix(in srgb, var(--marker-color) 18%, transparent),
        0 0 26px color-mix(in srgb, var(--marker-color) 72%, transparent),
        0 10px 24px rgba(0, 0, 0, 0.34);
      transform: translate3d(0, 0, 0);
    }

    .footprint-marker::after {
      content: "";
      width: 42%;
      height: 42%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      opacity: 0.6;
    }

    .footprint-marker.is-muted {
      opacity: 0.28;
      filter: grayscale(0.8);
    }

    .marker-label {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      padding: 3px 6px;
      border-radius: 999px;
      background: rgba(5, 7, 6, 0.72);
      color: #fff7ed;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .marker-label.pos-left {
      top: 50%;
      right: calc(100% + 6px);
      left: auto;
      transform: translateY(-50%);
    }

    .marker-label.pos-right {
      top: 50%;
      left: calc(100% + 6px);
      transform: translateY(-50%);
    }

    .marker-label.pos-top {
      top: auto;
      bottom: calc(100% + 6px);
    }

    .map-fallback {
      position: absolute;
      inset: 0;
    }

    .map-wrap {
      position: relative;
      aspect-ratio: 1.14 / 1;
      width: 100%;
      height: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        #07110f;
      background-size: 28px 28px;
    }

    .map-svg {
      position: absolute;
      inset: 9px;
      width: calc(100% - 18px);
      height: calc(100% - 18px);
    }

    .map-svg path {
      fill: rgba(255, 255, 255, 0.045);
      stroke: rgba(219, 177, 113, 0.46);
      stroke-width: 2;
    }

    .city-dot {
      position: absolute;
      display: grid;
      place-items: center;
      width: var(--size, 16px);
      height: var(--size, 16px);
      margin: calc(var(--size, 16px) / -2) 0 0 calc(var(--size, 16px) / -2);
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      background: var(--dot, var(--orange));
      box-shadow: 0 0 0 7px color-mix(in srgb, var(--dot, var(--orange)) 18%, transparent), 0 0 24px color-mix(in srgb, var(--dot, var(--orange)) 60%, transparent);
    }

    .city-dot span {
      position: absolute;
      top: calc(100% + 5px);
      left: 50%;
      color: #f8f1e8;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.92);
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 2px 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 999px;
      background: var(--dot, var(--orange));
    }

    .stat-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
    }

    .stat-strip div {
      padding: 12px 8px;
      background: rgba(255, 255, 255, 0.04);
      text-align: center;
    }

    .stat-strip b {
      display: block;
      color: var(--gold);
      font-size: 23px;
    }

    .stat-strip span {
      color: var(--muted);
      font-size: 12px;
    }

    .city-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .city-tile {
      min-height: 94px;

    function navigate(view, options = {}) {
      const push = options.push !== false;
      if (push && state.view !== view) state.history.push(state.view);
      state.view = view;
      if (["passport", "map", "archive", "community", "profile"].includes(view)) state.tab = view;
      render();
      screen.scrollTop = 0;
    }

    function goBack() {
      const previous = state.history.pop();
      navigate(previous || state.tab || "passport", { push: false });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);

    function destroyFootprintMap() {
      if (footprintMap) {

    function mapTypeColor(type) {
      if (type === "pb") return "#f36a17";
      if (type === "official") return "#4b95ff";
      return "rgba(255,255,255,0.78)";
    }

    function mapMarkerSize(count) {
      return 24 + Math.min(count, 3) * 6;
    }

    function matchesMapFilter(city) {
      if (state.mapFilter === "all") return true;
      if (state.mapFilter === "official") return city.type === "official" || city.type === "pb";
      if (state.mapFilter === "pb") return city.type === "pb";
      return city.type === "pending";
    }

    function mapPopup(city) {
      const status = city.type === "pb" ? "PB 城市" : city.type === "official" ? "官方认证" : "待解锁";
      return `

      `;

    function renderLocalMapFallback(container) {
      container.innerHTML = `
        <div class="map-fallback">
          <div class="map-wrap">
            <svg class="map-svg" viewBox="0 0 360 300" aria-hidden="true">
              <path d="M44 82 72 58l42-9 34 15 27-20 53 16 31 31 45 1 23 32-17 36 17 34-37 26-45-1-32 28-52-16-48 17-39-21-47 4-21-33 15-43-26-31 28-40Z"></path>
              <path d="M90 128 146 100l76 11 51-18M118 196l55-53 78 35M206 228l19-63 65-8"></path>
            </svg>
            ${cityDot("北京", 67, 31, "pb", 19)}
            ${cityDot("无锡", 73, 48, "official", 16)}
            ${cityDot("上海", 79, 54, "official", 16)}
            ${cityDot("厦门", 71, 75, "pb", 24)}
            ${cityDot("武汉", 58, 58, "official", 15)}
            ${cityDot("成都", 42, 58, "official", 15)}
            ${cityDot("沈阳", 75, 24, "official", 14)}
            ${cityDot("郑州", 57, 44, "pending", 12)}
            ${cityDot("广州", 64, 76, "pending", 13)}
          </div>
        </div>
      `;
    }

    function createFootprintMarker(city) {
      const size = mapMarkerSize(city.count);
      const icon = L.divIcon({
        className: "",
        html: `
          <div class="footprint-marker ${matchesMapFilter(city) ? "" : "is-muted"}" style="--marker-size:${size}px;--marker-color:${mapTypeColor(city.type)}">
            <span class="marker-label ${city.label ? `pos-${city.label}` : ""}">${city.city}</span>
          </div>
        `,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        popupAnchor: [0, -size / 2]
      });
      const marker = L.marker([city.lat, city.lng], { icon }).addTo(footprintMap);
      marker.bindPopup(mapPopup(city));
      marker.on("click", () => {
        footprintMap.flyTo([city.lat, city.lng], Math.max(footprintMap.getZoom(), 5.4), { duration: 0.55 });
      });
      footprintMarkers.set(city.id, marker);
    }

    function initFootprintMap() {
      const container = document.querySelector("#footprintMap");
      if (!container) return;
      destroyFootprintMap();

      if (!window.L) {
        renderLocalMapFallback(container);
        return;
      }

      const isMobile = window.matchMedia("(max-width: 700px)").matches;
      footprintMap = L.map(container, {
        attributionControl: true,
        boxZoom: false,
        doubleClickZoom: true,
        dragging: true,
        scrollWheelZoom: false,
        tap: true,
        zoomControl: true
      }).setView(isMobile ? [32.4, 112.8] : [33.2, 112.8], isMobile ? 3.72 : 4.25);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 18,
        minZoom: 3
      }).addTo(footprintMap);

      routeLine = L.polyline(
        mapCities.filter(city => city.type !== "pending").map(city => [city.lat, city.lng]),
        {
          color: "#f36a17",
          dashArray: "8 10",
          lineCap: "round",
          opacity: state.mapFilter === "all" ? 0.72 : 0.22,
          weight: 3
        }
      ).addTo(footprintMap);

      mapCities.forEach(createFootprintMarker);
      setTimeout(() => footprintMap?.invalidateSize(), 40);
    }

    }

    document.addEventListener("click", event => {
      const tabButton = event.target.closest("[data-tab]");
      if (tabButton) {
        state.history = [];
        navigate(tabButton.dataset.tab);
        return;
      }

      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        navigate(viewButton.dataset.view);
        return;
      }

      const mapFilter = event.target.closest("[data-map-filter]");
      if (mapFilter) {
        state.mapFilter = mapFilter.dataset.mapFilter;
        render();
        showToast(`已切换到${mapFilter.textContent}`);
        return;
      }

      const memoryTab = event.target.closest("[data-memory-tab]");
      if (memoryTab) {
        state.memoryTab = memoryTab.dataset.memoryTab;
        render();
        return;
      }

      const feedTab = event.target.closest("[data-feed-tab]");
      if (feedTab) {
        state.feedTab = feedTab.dataset.feedTab;
        render();
        return;
      }

      const template = event.target.closest("[data-template]");
      if (template) {
        state.posterTemplate = template.dataset.template;
        render();
        showToast(`已切换到${template.textContent}模板`);
        return;
      }

      const action = event.target.closest("[data-action]");
      if (!action) return;
      const type = action.dataset.action;
      const messages = {
        share: "已生成当前页面分享卡片",
        filter: "筛选面板将在正式版打开",
        "save-ocr": "成绩已保存到 2024 厦门马拉松纪念册",
        "save-poster": "海报已保存到相册",
        "share-poster": "海报分享链接已生成",
        post: "动态已发布到同场话题",
        "share-profile": "个人纪念册分享链接已生成"
      };
      showToast(messages[type] || "操作已完成");
    });

    backBtn.addEventListener("click", goBack);

    screen.addEventListener("scroll", () => {
      topbar.classList.toggle("is-raised", screen.scrollTop > 8);
    });

    window.addEventListener("leaflet-ready", () => {
      if (state.view === "map") initFootprintMap();
    });

    render();
  </script>
</body>
</html>
