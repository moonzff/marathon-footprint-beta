<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>跑马纪念册内测版</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050706;
      --panel: #0d1210;
      --panel-2: #131a16;
      --panel-3: #1a231f;
      --text: #f6f1e8;
      --muted: #9fa9a2;
      --weak: #707970;
      --line: rgba(255, 255, 255, 0.09);
      --orange: #f36a17;
      --orange-2: #ff8b35;
      --gold: #d9b374;
      --blue: #4b95ff;
      --green: #35c875;
      --red: #e85a4f;
      --poster-green-bg: #1A2F23;
      --poster-green-accent: #7CB342;
      --poster-green-secondary: #4A5D4E;
      --radius: 8px;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; min-height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(243, 106, 23, 0.18), transparent 25rem),
        radial-gradient(circle at 96% 12%, rgba(75, 149, 255, 0.12), transparent 24rem),
        #020302;
      color: var(--text);
      overflow: hidden;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 0;
      color: inherit;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(255, 255, 255, 0.045);
      outline: none;
    }
    input, select { height: 44px; padding: 0 12px; }
    textarea { min-height: 92px; padding: 12px; resize: vertical; }
    select option { color: #101410; background: #f8f2e8; }
    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100svh;
      height: 100dvh;
      min-height: 100svh;
      width: min(100%, 430px);
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 240px), var(--bg);
      box-shadow: var(--shadow);
    }
    @media (min-width: 700px) {
      body { padding: 18px 0; }
      .app {
        height: calc(100dvh - 36px);
        min-height: calc(100svh - 36px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
      }
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: calc(54px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 10px 0;
      background: rgba(5, 7, 6, 0.84);
      border-bottom: 1px solid transparent;
      backdrop-filter: blur(18px);
    }
    .topbar.is-raised { border-bottom-color: var(--line); }
    .titlebox { min-width: 0; text-align: center; line-height: 1.22; }
    .titlebox b {
      display: block;
      overflow: hidden;
      font-size: 16px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .titlebox span {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 999px;
    }
    .icon-btn:active { background: rgba(255,255,255,0.08); }
    .back-btn[hidden] {
      display: inline-grid;
      visibility: hidden;
      pointer-events: none;
    }
    .screen {
      flex: 1;
      min-height: 0;
      padding: 14px 14px calc(130px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }
    .tabbar {
      position: fixed;
      right: max(0px, calc((100vw - 430px) / 2));
      bottom: 0;
      left: max(0px, calc((100vw - 430px) / 2));
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(9, 12, 11, 0.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(20px);
    }
    .tabbar button {
      display: grid;
      justify-items: center;
      gap: 4px;
      min-width: 0;
      padding: 6px 2px 4px;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .tabbar button::before {
      content: "";
      width: 20px;
      height: 20px;
      border: 2px solid currentColor;
      border-radius: 7px;
      opacity: 0.74;
    }
    .tabbar button[data-tab="map"]::before { border-radius: 999px; }
    .tabbar button[data-tab="archive"]::before {
      width: 18px;
      border-radius: 4px;
      box-shadow: inset 0 5px 0 rgba(255,255,255,0.16);
    }
    .tabbar button[data-tab="community"]::before { border-radius: 999px 999px 999px 4px; }
    .tabbar button[data-tab="profile"]::before { width: 18px; border-radius: 999px 999px 7px 7px; }
    .tabbar button.is-active { color: var(--orange); background: rgba(243,106,23,0.1); }
    .stack { display: grid; gap: 12px; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.025)), var(--panel);
      box-shadow: 0 12px 34px rgba(0,0,0,0.18);
    }
    .hero-card {
      position: relative;
      min-height: 188px;
      padding: 16px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(5,7,6,0.92), rgba(5,7,6,0.34)),
        url("assets/memorial-ui-01-passport-home.jpg") center 16% / 270% auto;
    }
    .hero-card::after {
      content: "BETA";
      position: absolute;
      right: 16px;
      top: 15px;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 1px solid rgba(217,179,116,0.5);
      border-radius: 999px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      transform: rotate(-14deg);
    }
    .runner-head { display: flex; gap: 12px; align-items: center; }
    .avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      background: linear-gradient(135deg, #2b3530, #151b18);
      color: var(--gold);
      font-weight: 900;
    }
    .runner-head h1, .public-card h1 { margin: 0; font-size: 23px; line-height: 1.14; letter-spacing: 0; }
    .tag-row, .runner-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.045);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .tag.orange { color: #ffd7be; background: rgba(243,106,23,0.18); border-color: rgba(243,106,23,0.32); }
    .tag.blue { color: #cfe2ff; background: rgba(75,149,255,0.16); border-color: rgba(75,149,255,0.28); }
    .tag.green { color: #d5ffe4; background: rgba(53,200,117,0.16); border-color: rgba(53,200,117,0.28); }
    .tag.gold { color: #ffe6bd; background: rgba(217,179,116,0.15); border-color: rgba(217,179,116,0.25); }
    .passport-stats, .stat-strip, .public-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
    }
    .passport-stats div, .stat-strip div, .public-meta div {
      min-width: 0;
      padding: 12px 6px;
      background: rgba(7,10,8,0.78);
      text-align: center;
    }
    .passport-stats b, .stat-strip b, .public-meta b {
      display: block;
      overflow: hidden;
      color: #ffe1b9;
      font-size: 20px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .passport-stats span, .stat-strip span, .public-meta span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric-card {
      min-height: 104px;
      padding: 13px;
      text-align: left;
    }
    .metric-card span, .muted { color: var(--muted); }
    .metric-card b {
      display: block;
      margin-top: 8px;
      color: var(--orange-2);
      font-size: 28px;
      line-height: 1;
    }
    .metric-card small { display: block; margin-top: 8px; color: var(--muted); }
    .primary-actions, .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .solid-btn, .ghost-btn, .action-btn, .danger-btn {
      display: inline-grid;
      place-items: center;
      min-height: 46px;
      padding: 0 14px;
      border-radius: var(--radius);
      font-weight: 850;
      text-decoration: none;
    }
    .solid-btn, .action-btn {
      background: linear-gradient(180deg, var(--orange-2), var(--orange));
      color: #fff7ef;
      box-shadow: 0 12px 26px rgba(243,106,23,0.24);
    }
    .ghost-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.045);
      color: var(--text);
    }
    .danger-btn {
      border: 1px solid rgba(232,90,79,0.36);
      background: rgba(232,90,79,0.12);
      color: #ffd4cf;
    }
    .section-title, .year-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }
    .section-title h2, .year-head b { margin: 0; font-size: 18px; line-height: 1.15; }
    .section-title span, .year-head span { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .race-row, .feed-card, .form-card, .admin-card, .public-card, .poster-card, .memory-card {
      padding: 13px;
    }
    .race-row {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
    }
    .race-row h3, .feed-card p { margin: 0; font-size: 15px; line-height: 1.35; }
    .race-row p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .race-time { margin-top: 8px; color: var(--orange-2); font-size: 22px; font-weight: 900; letter-spacing: 0; }
    .medal {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 32% 24%, #fff1c5, transparent 23%),
        linear-gradient(135deg, #7a542b, #d6a553 46%, #775026);
      border: 2px solid rgba(255,232,184,0.42);
      box-shadow: inset 0 0 0 5px rgba(0,0,0,0.15), 0 8px 18px rgba(0,0,0,0.28);
    }
    .medal.silver { filter: grayscale(0.75) brightness(1.2); }
    .row-action { color: var(--weak); font-size: 28px; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .search {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255,255,255,0.045);
      font-size: 13px;
    }
    .chips, .feed-tabs {
      display: flex;
      gap: 8px;
      overflow: auto;
      padding-bottom: 1px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar, .feed-tabs::-webkit-scrollbar { display: none; }
    .chip, .feed-tabs button {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.045);
      font-size: 12px;
      font-weight: 750;
    }
    .chip.is-active, .feed-tabs button.is-active {
      color: #fff4eb;
      border-color: rgba(243,106,23,0.35);
      background: rgba(243,106,23,0.2);
    }
    .map-card { position: relative; overflow: hidden; padding: 0; }
    .interactive-map {
      width: 100%;
      height: min(68vh, 430px);
      min-height: 360px;
      background: #0a1210;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .leaflet-container { background: #0a1210; font: inherit; }
    .map-legend {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-width: calc(100% - 20px);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(5,7,6,0.78);
      backdrop-filter: blur(12px);
    }
    .map-legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--dot);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--dot), transparent 76%);
    }
    .footprint-marker {
      position: relative;
      width: var(--marker-size);
      height: var(--marker-size);
      border-radius: 999px;
      background: color-mix(in srgb, var(--marker-color), transparent 20%);
      border: 2px solid rgba(255,255,255,0.86);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--marker-color), transparent 76%), 0 8px 16px rgba(0,0,0,0.34);
    }
    .footprint-marker.is-muted { opacity: 0.26; filter: grayscale(0.5); }
    .marker-label {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 6px);
      transform: translateX(-50%);
      padding: 2px 5px;
      border-radius: 5px;
      color: #fff;
      background: rgba(0,0,0,0.58);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }
    .map-fallback {
      display: grid;
      place-items: center;
      min-height: 360px;
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }
    .map-city-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .map-city-pill {
      padding: 6px 9px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.045);
      font-size: 11px;
      font-weight: 800;
    }
    .form-grid { display: grid; gap: 10px; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 750; }
    .field small { color: var(--weak); font-size: 11px; line-height: 1.45; }
    .score-upload {
      padding: 12px;
      border: 1px solid rgba(217,179,116,0.24);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(217,179,116,0.1), rgba(255,255,255,0.035));
    }
    .score-upload label {
      color: #ffe3bf;
      font-size: 14px;
    }
    .form-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
      color: #ffe3bf;
      font-size: 13px;
      font-weight: 850;
    }
    .form-section span {
      color: var(--weak);
      font-size: 11px;
      font-weight: 700;
    }
    .ocr-status {
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      font-size: 12px;
      line-height: 1.5;
    }
    .ocr-status[data-status="reading"] { color: #ffe6bd; border-color: rgba(217,179,116,0.36); background: rgba(217,179,116,0.1); }
    .ocr-status[data-status="verified"] { color: #d5ffe4; border-color: rgba(53,200,117,0.34); background: rgba(53,200,117,0.1); }
    .ocr-status[data-status="partial"] { color: #cfe2ff; border-color: rgba(75,149,255,0.34); background: rgba(75,149,255,0.1); }
    .ocr-status[data-status="failed"] { color: #ffd7d2; border-color: rgba(232,90,79,0.36); background: rgba(232,90,79,0.1); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .birth-field {
      grid-column: 1 / -1;
    }
    .birth-selects {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr 0.9fr;
      gap: 8px;
    }
    .birth-selects select {
      min-width: 0;
      padding: 0 7px;
      color: var(--text);
      background-color: rgba(255, 255, 255, 0.065);
      font-size: 13px;
      text-align: center;
      -webkit-text-fill-color: var(--text);
    }
    .feed-head {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 9px;
      align-items: center;
      margin-bottom: 10px;
    }
    .mini-avatar {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(135deg, #26322e, #121715);
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
    }
    .feed-head b { display: block; font-size: 13px; }
    .feed-head span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .feed-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .composer {
      position: sticky;
      bottom: 82px;
      display: grid;
      grid-template-columns: 1fr 64px;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(9,12,11,0.92);
      backdrop-filter: blur(18px);
    }
    .composer input { height: 40px; }
    .composer button {
      border-radius: var(--radius);
      background: var(--orange);
      color: white;
      font-weight: 850;
    }
    .public-card {
      color: #2a2117;
      background:
        linear-gradient(180deg, rgba(255,249,239,0.94), rgba(232,214,187,0.94)),
        url("assets/memorial-ui-08-public-profile.jpg") center / cover;
    }
    .public-card .muted, .public-card .public-meta span { color: #766856; }
    .public-card .public-meta { background: rgba(70,50,24,0.16); border-color: rgba(70,50,24,0.16); }
    .public-card .public-meta div { background: rgba(255,255,255,0.52); }
    .public-card .public-meta b { color: #a3470e; }
    .poster-card {
      padding: 12px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(124,179,66,0.16), transparent 12rem),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
        #070908;
    }
    .poster-stage {
      position: relative;
      padding: 10px;
      border-radius: 14px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.09), transparent 16%, transparent 84%, rgba(255,255,255,0.06)),
        #030605;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 22px 48px rgba(0,0,0,0.4);
    }
    .poster-preview {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid rgba(181,203,147,0.28);
      border-radius: 10px;
      background:
        radial-gradient(circle at 86% 10%, rgba(181,203,147,0.12), transparent 9rem),
        radial-gradient(circle at 70% 56%, rgba(67,119,86,0.22), transparent 12rem),
        linear-gradient(180deg, rgba(26,47,35,0.96), rgba(1,9,8,0.99)),
        var(--poster-green-bg);
    }
    .poster-preview::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(124,179,66,0.12), transparent 1px) 0 0 / 56px 100%,
        linear-gradient(180deg, rgba(124,179,66,0.08), transparent 1px) 0 0 / 100% 62px,
        radial-gradient(circle at 72% 46%, rgba(124,179,66,0.16), transparent 11rem);
      opacity: 0.22;
      pointer-events: none;
    }
    .poster-preview::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 62%, rgba(0,0,0,0.66) 91%),
        linear-gradient(90deg, rgba(0,0,0,0.28), transparent 52%, rgba(0,0,0,0.18));
      opacity: 0.82;
      pointer-events: none;
    }
    .poster-kicker {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 6;
      display: inline-flex;
      padding: 5px 10px;
      border: 1px solid rgba(124,179,66,0.28);
      border-radius: 999px;
      color: rgba(235,244,207,0.92);

      return "";
    }

    function eventDistanceKm(event) {
      return event.distance === "半马" ? 21.0975 : 42.195;
    }

    function generateSeed() {
      const cities = ["武汉", "咸宁", "厦门", "无锡", "上海", "北京", "杭州", "成都", "重庆", "南京", "广州", "深圳", "长沙", "兰州", "沈阳", "青岛", "哈尔滨", "昆明", "西安", "郑州"];
      const nickA = ["东湖", "江城", "湖边", "配速", "破三", "周末", "汉口", "光谷", "海风", "山路", "晨跑", "夜跑", "稳住", "冲线", "补给", "一路", "老街", "江滩", "热干面", "桂花"];
      const nickB = ["阿明", "老周", "小陈", "Lily", "阿杰", "小夏", "老李", "小雨", "阿峰", "小赵", "阿宁", "大宇", "小北", "阿南", "一鸣", "小宋", "阿琳", "阿凯", "小朱", "阿森"];
      const users = [];
      const results = [];
      const posts = [];
      const feedback = [];
      const usedNames = new Set();

      for (let i = 0; i < 168; i += 1) {
        let nickname = `${pick(nickA)}${pick(nickB)}`;
        while (usedNames.has(nickname)) nickname = `${pick(nickA)}${pick(nickB)}${i}`;
        usedNames.add(nickname);
        const homeCity = pick(cities);
        const runningYears = 1 + Math.floor(random() * 11);
        const baseFull = Math.round(10300 + random() * 9500 + (i % 9) * 120);
        const gender = random() > 0.34 ? "male" : "female";
        const birthDate = `${1972 + Math.floor(random() * 25)}-${pad2(1 + Math.floor(random() * 12))}-${pad2(1 + Math.floor(random() * 27))}`;
        const user = {
          id: `seed_user_${i + 1}`,
          slug: `runner-${i + 1}`,
          nickname,
          homeCity,
          gender,
          birthDate,
          runningYears,
          runnerGoal: pick(runnerGoals).id,
          runnerStyle: pick(runnerStyles).id,
          motto: pick(["每一场完赛，都值得被记住", "跑过的城市，都是自己的纪念章", "不追每天，只收好每一场", "成绩会过去，记忆会留下", "下一次起跑，还是热爱"]),
          publicProfile: random() > 0.18,
          synthetic: true,
          createdAt: "2026-06-03T00:00:00.000Z"
        };
        users.push(user);

        const count = 1 + Math.floor(random() * 9);
        const sampledEvents = [...raceEvents].sort(() => random() - 0.5).slice(0, count);
        let bestFull = Infinity;
        let bestHalf = Infinity;
        sampledEvents.forEach((event, index) => {
          const km = eventDistanceKm(event);
          const base = event.distance === "半马" ? Math.round(baseFull * 0.47) : baseFull;
          const variance = Math.round((random() - 0.24) * (event.distance === "半马" ? 1800 : 4200));
          const seconds = Math.max(event.distance === "半马" ? 4500 : 9000, base + variance + index * 90);
          const isFullPb = event.distance === "全马" && seconds < bestFull;
          const isHalfPb = event.distance === "半马" && seconds < bestHalf;
          if (event.distance === "全马") bestFull = Math.min(bestFull, seconds);
          if (event.distance === "半马") bestHalf = Math.min(bestHalf, seconds);
          results.push({
            id: `seed_result_${i + 1}_${event.id}`,
            userId: user.id,
            eventId: event.id,
            eventName: event.name,
            city: event.city,
            date: event.date,
            distance: event.distance,
            seconds,
            time: secondsToTime(seconds),
            pace: pace(seconds, km),
            rank: `${Math.max(80, Math.round(seconds / 12 + random() * 1800))} / ${event.capacity}`,
            ageRank: `${Math.max(12, Math.round(seconds / 55 + random() * 330))} / ${Math.round(event.capacity * 0.075)}`,
            level: roadLevelFor(seconds, event.distance, user, event.date),
            runnerGoal: user.runnerGoal,
            runnerStyle: user.runnerStyle,
            official: random() > 0.22,
            pb: isFullPb || isHalfPb,
            medal: random() > 0.16 ? "gold" : "silver",
            source: random() > 0.35 ? "official" : "manual",
            note: pick(["补给稳定，最后十公里撑住了", "赛道氛围很好，冲线很有记忆点", "天气有点热，但整体发挥正常", "赛后证书等了很久，想自己先收进纪念册", "和朋友一起完赛，这场很特别"]),
            synthetic: true,
            createdAt: event.date + "T10:30:00.000Z"
          });
        });
      }

      const postTemplates = {
        pb: ["终于刷新 PB，最后两公里全靠意志撑住。", "这场配速很稳，冲线那一下很值。", "破目标了，想把这场单独做成纪念册。"],
        route: ["后半程风有点大，过桥那段需要心理准备。", "赛道观众很多，进城那段气氛最好。", "折返点略密，跟跑的时候要注意节奏。"],
        supply: ["补给桌够长，水站志愿者很给力。", "盐丸点设置合理，天气热的时候很关键。", "赛后领物动线还可以再顺一点。"],
        photo: ["沿途照片很出片，尤其是城市地标那一段。", "冲线照终于拍清楚了，可以做海报。", "同场跑友有没有拍到 330 兔子附近的照片？"]
      };
      const topicKeys = Object.keys(postTemplates);
      for (let i = 0; i < 260; i += 1) {
        const user = pick(users);
        const userResults = results.filter(result => result.userId === user.id);
        const result = pick(userResults.length ? userResults : results);
        const topic = pick(topicKeys);
        posts.push({
          id: `seed_post_${i + 1}`,
          userId: user.id,
          eventId: result.eventId,
          topic,
          content: pick(postTemplates[topic]),
          likes: Math.floor(8 + random() * 180),
          comments: Math.floor(random() * 42),
          synthetic: true,
          createdAt: new Date(Date.now() - Math.round(random() * 1000 * 60 * 60 * 24 * 80)).toISOString()
        });
      }

      for (let i = 0; i < 26; i += 1) {
        feedback.push({
          id: `seed_feedback_${i + 1}`,
          userId: pick(users).id,
          type: pick(["功能建议", "体验问题", "内容想法"]),
          content: pick(["希望支持把官方成绩单截图一起保存", "同场跑友这个入口很有意思，可以按配速段筛", "城市足迹地图希望能看全国跑友热力", "个人主页可以加年度回顾", "希望有亲友可看的公开分享页"]),
          synthetic: true,
          createdAt: new Date(Date.now() - Math.round(random() * 1000 * 60 * 60 * 24 * 30)).toISOString()
        });
      }

      return {
        version: 1,
        seededAt: "2026-06-03T00:00:00.000Z",
        savedAt: null,
        deletedResultIds: [],
        events: raceEvents,
        users,
        results,
        posts,
        feedback
      };
    }

    function getCurrentUser() {
      return db?.users.find(user => user.id === state.currentUserId) || null;
    }

    function userInitial(user) {
      return safe((user?.nickname || "跑者").slice(0, 1));

    function userResults(userId = state.currentUserId) {
      return (db?.results || [])
        .filter(result => result.userId === userId)
        .sort((a, b) => b.date.localeCompare(a.date));
    }

    function bestResult(results, distance = "全马") {
      return results.filter(result => result.distance === distance).sort((a, b) => a.seconds - b.seconds)[0] || null;
    }

    function userStats(userId = state.currentUserId) {
      const results = userResults(userId);
      const cities = new Set(results.map(result => result.city));
      const fullPb = bestResult(results, "全马");
      const halfPb = bestResult(results, "半马");
      const officialCount = results.filter(result => result.official).length;
      const bestLevel = displayLevel(fullPb?.level) || displayLevel(halfPb?.level) || "";
      return { results, cities, fullPb, halfPb, officialCount, bestLevel };
    }

    function resultEvent(result) {
      return db.events.find(event => event.id === result.eventId) || raceEvents.find(event => event.id === result.eventId);

    function goalById(id) {
      return runnerGoals.find(goal => goal.id === id) || runnerGoals[0];

    function currentGoal(result, user = getCurrentUser()) {

    function shouldUseRunnerHeroPoster(assets, goal) {
      const runnerPhoto = assets?.runnerPhoto;
      const fitAllowsPoster = runnerPhoto?.runnerFit?.usable !== false;

    function posterLayoutClass(goal, useRunnerHero) {
      if (useRunnerHero) return "poster-layout-runner has-runner-photo has-cutout-photo";
      if (goal.id === "finish") return "poster-layout-certificate";
      return "poster-layout-official";
    }

    function runnerPhotoFitStyle(runnerPhoto) {
      const fit = runnerPhoto?.runnerFit || {};
      const scale = clampNumber(fit.scale ?? 1, 0.72, 1.12);
      const offsetPattern = /^-?\d+(\.\d+)?%$/;
      const x = offsetPattern.test(String(fit.x || "")) ? String(fit.x) : "0%";
      const y = offsetPattern.test(String(fit.y || "")) ? String(fit.y) : "0%";
      return ` style="--runner-fit-scale:${scale};--runner-fit-x:${safe(x)};--runner-fit-y:${safe(y)}"`;

    function posterCopyFor(result, user, goal) {
      const city = result.city || "这座城";
      const name = user?.nickname || "跑者";
      const style = styleById(result.runnerStyle || user?.runnerStyle || "zen");
      const pbText = result.pb ? "PB 成功" : "完赛成功";
      const copy = {
        pb: {
          title: pbText,
          line: `${name} · ${style.label}`,

        },

          title: "出片成功",

        },
        vlog: {
          title: "Vlog 素材到位",
          line: `${style.label} · ${city}赛道第一视角`,
          foot: `起跑、补给、冲线，剪成一条完整回忆。`
        },
        finish: {

          line: `${name} · ${style.label}`,
          foot: `不必每天晒训练，但每场完赛都值得保存。`
        }
      };
      const selected = copy[goal.id] || copy.pb;
      return { ...selected, styleLine: style.line };
    }

    function posterEventTitle(result, event = {}) {
      return result.eventName || event.name || `${result.city || "完赛"}${result.distance === "半马" ? "半程马拉松" : "马拉松"}`;
    }

    function posterLineHtml(text) {
      const value = String(text || "").trim();
      const matched = value.match(/^(.*[，,])([^，,]{2,8}[。.!?]?)$/);
      if (!matched) return safe(value);
      return `${safe(matched[1])}<span class="poster-nowrap">${safe(matched[2])}</span>`;
    }

    function posterFootHtml(copy) {
      return [copy.styleLine, copy.foot]
        .filter(Boolean)
        .map(line => `<span>${posterLineHtml(line)}</span>`)
        .join("");
    }

    function safeExternalUrl(value) {
      const text = String(value || "").trim();
      return /^https?:\/\//i.test(text) ? text : "";
    }

    function normalizedBibNumber(value) {
      return String(value || "").trim().toUpperCase().replace(/\s+/g, "");
    }

    function resultDuplicateKey(result) {
      if (!result?.userId || !result.date || !result.distance || !result.time) return "";
      const eventKey = result.eventId || `${result.eventName || ""}|${result.city || ""}`;
      const bibKey = normalizedBibNumber(result.bibNumber);
      return [result.userId, eventKey, result.date, result.distance, bibKey || result.time].join("|");
    }

    function mergeResultRecords(primary, duplicate) {
      const createdAt = [primary.createdAt, duplicate.createdAt].filter(Boolean).sort()[0] || primary.createdAt || duplicate.createdAt;
      return {
        ...primary,
        ...duplicate,
        id: primary.id,
        assets: { ...(primary.assets || {}), ...(duplicate.assets || {}) },
        official: Boolean(primary.official || duplicate.official),
        pb: Boolean(primary.pb || duplicate.pb),
        level: displayLevel(duplicate.level) || displayLevel(primary.level),
        createdAt,
        updatedAt: duplicate.updatedAt || primary.updatedAt
      };
    }

    function dedupeResults(results = []) {
      const indexByKey = new Map();
      return results.reduce((list, result) => {
        const key = resultDuplicateKey(result);
        if (!key) return [...list, result];
        const existingIndex = indexByKey.get(key);
        if (existingIndex === undefined) {
          indexByKey.set(key, list.length);
          return [...list, result];
        }
        const next = [...list];
        next[existingIndex] = mergeResultRecords(next[existingIndex], result);
        return next;
      }, []);
    }

    function findDuplicateResultIndex(candidate, excludeId = "") {
      const key = resultDuplicateKey(candidate);
      if (!key) return -1;
      return (db?.results || []).findIndex(result => result.id !== excludeId && resultDuplicateKey(result) === key);
    }

    function eventAssets(event) {
      return [
        ["路线图", `${event.city}城市路线`],
        ["参赛服", `${event.date.slice(0, 4)} 赛事服`],
        ["奖牌", `${event.grade}`],
        ["号码布", `${event.city} A8123`]
      ];
    }

    function normalizeBetaState(next) {
      if (!next) return next;
      next.version = Math.max(Number(next.version || 1), 2);
      next.deletedResultIds = [...new Set(next.deletedResultIds || [])];
      next.events = mergeById(raceEvents, next.events || []).map(event => ({
        ...event,
        assets: event.assets || eventAssets(event)
      }));
      next.users = (next.users || []).map(user => ({
        ...user,
        gender: user.gender || "",
        birthDate: user.birthDate || "",
        runnerGoal: user.runnerGoal || "",
        runnerStyle: user.runnerStyle || "",
        publicProfile: user.publicProfile !== false
      }));
      const deletedResultIds = new Set(next.deletedResultIds);
      next.results = dedupeResults((next.results || []).filter(result => !deletedResultIds.has(result.id)).map(result => {
        const event = next.events.find(item => item.id === result.eventId);
        return {
          ...result,
          eventName: result.eventName || event?.name || "未命名赛事",
          city: result.city || event?.city || "未知城市",
          genderRank: result.genderRank || "",
          level: displayLevel(result.level),
          runnerGoal: result.runnerGoal || "pb",
          runnerStyle: result.runnerStyle || "zen",
          assets: result.assets || {}
        };
      }));
      next.posts = next.posts || [];
      next.feedback = next.feedback || [];
      return next;
    }

    const EVENT_ALIASES = [
      { city: "长沙", words: ["湘江", "湘马", "湘江半马", "湘江半程", "xiangjiang"] },
      { city: "咸宁", words: ["咸宁", "xianning", "咸马"] },
      { city: "武汉", words: ["武汉", "wuhan", "汉马"] },
      { city: "厦门", words: ["厦门", "xiamen", "厦马"] },
      { city: "无锡", words: ["无锡", "wuxi", "锡马"] },
      { city: "上海", words: ["上海", "shanghai", "上马"] },
      { city: "北京", words: ["北京", "beijing", "北马"] }
    ];

    function parseEventDateFromText(text) {
      const value = normalizeScoreText(text);
      const full = value.match(/(20\d{2})\s*(?:年|[-/.])\s*(\d{1,2})\s*(?:月|[-/.])\s*(\d{1,2})\s*(?:日)?/);
      if (full) {
        const date = `${full[1]}-${pad2(full[2])}-${pad2(full[3])}`;
        return { date, year: full[1] };
      }
      const year = value.match(/(20\d{2})/);
      return year ? { date: "", year: year[1] } : { date: "", year: "" };
    }

    function selectBestEventMatch(text, fileName = "") {
      const value = normalizeScoreText(`${text || ""} ${fileName || ""}`).toLowerCase();
      if (!value.trim() || !db?.events?.length) return null;
      const parsedDate = parseEventDateFromText(value);
      const aliasHit = EVENT_ALIASES.find(item => item.words.some(word => value.includes(word.toLowerCase())));
      let candidates = db.events.filter(event => {
        const direct = value.includes(event.city.toLowerCase()) || value.includes(event.name.toLowerCase());
        return direct || (aliasHit && event.city === aliasHit.city);
      });
      if (!candidates.length) return null;
      if (parsedDate.date) {
        const exactDate = candidates.find(event => event.date === parsedDate.date);
        if (exactDate) return exactDate;
      }
      if (parsedDate.year) {
        const sameYear = candidates.find(event => event.date.startsWith(parsedDate.year));
        if (sameYear) return sameYear;
      }
      return candidates.slice().sort((a, b) => b.date.localeCompare(a.date))[0] || null;
    }

    function findEventFromText(text) {
      return selectBestEventMatch(text);
    }

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) {
          existing.addEventListener("load", resolve, { once: true });
          existing.addEventListener("error", reject, { once: true });
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error("ocr_script_failed"));
        document.head.appendChild(script);
      });
    }

    async function ensureTesseract() {
      if (window.Tesseract?.createWorker) return window.Tesseract;
      if (!tesseractPromise) {
        tesseractPromise = loadScriptOnce("https://unpkg.com/tesseract.js@5/dist/tesseract.min.js").then(() => window.Tesseract);
      }
      const Tesseract = await tesseractPromise;
      if (!Tesseract?.createWorker) throw new Error("ocr_library_unavailable");
      return Tesseract;
    }

    function setReportOcrStatus(form, status, message) {
      state.reportOcrStatus = status;
      state.reportOcrMessage = message;
      const input = form?.querySelector("[data-ocr-status]");
      const statusCard = form?.querySelector("[data-ocr-status-card]");
      if (input) input.value = status;
      if (statusCard) {
        statusCard.dataset.status = status;
        statusCard.textContent = message;
      }
    }

    function markReportManualConfirmed(form, confirmed = true) {
      state.reportManualConfirmed = confirmed;
      const input = form?.querySelector("[data-manual-confirmed]");
      if (input) input.value = confirmed ? "true" : "false";
    }

    function selectedReportEvent(form) {
      return db.events.find(item => item.id === form?.eventId?.value) || db.events.find(item => item.id === state.selectedEventId) || db.events[0];
    }

    function updateLevelFromForm(form) {
      const preview = form?.querySelector("[data-level-preview]");
      if (!form?.time?.value) {
        if (preview) preview.textContent = roadLevelMessage("");
        return;
      }
      const seconds = parseTime(form.time.value);
      if (!seconds) {
        if (preview) preview.textContent = roadLevelMessage("");
        return;
      }
      const eventInfo = selectedReportEvent(form);
      const distance = String(form.distance?.value || eventInfo.distance);
      const level = roadLevelFor(seconds, distance, getCurrentUser(), eventInfo.date);
      if (form.level) form.level.value = level;
      if (preview) preview.textContent = roadLevelMessage(level);
    }

    function applyEventToReportForm(form, eventInfo) {
      if (!form || !eventInfo) return;
      state.selectedEventId = eventInfo.id;
      if (form.eventQuery) form.eventQuery.value = eventInfo.city;
      if (form.eventId) form.eventId.value = eventInfo.id;
      if (form.distance) form.distance.value = eventInfo.distance;
      updateLevelFromForm(form);
    }

    function normalizeScoreText(text) {
      return String(text || "")
        .replace(/[ \t\r]+/g, " ")
        .replace(/([\u4e00-\u9fa5])\s+([\u4e00-\u9fa5])/g, "$1$2")
        .replace(/[：]/g, ":")
        .replace(/[／]/g, "/")
        .trim();
    }

    function parseLabeledTimeFromText(text, labels) {
      const value = normalizeScoreText(text);
      const label = labels.map(escapeRegExp).join("|");
      const matched = value.match(new RegExp(`(?:${label})[^\\d]{0,18}(\\d{1,2}):([0-5]\\d):([0-5]\\d)`, "i"));
      if (!matched) return "";
      const candidate = `${Number(matched[1])}:${matched[2]}:${matched[3]}`;
      const seconds = parseTime(candidate);
      return seconds >= 2700 && seconds <= 36000 ? candidate : "";
    }

    function parseResultTimeFromText(text) {
      const value = normalizeScoreText(text);
      const netTime = parseLabeledTimeFromText(value, ["净计时成绩", "净成绩", "净计时", "净时间", "net time", "net"]);
      if (netTime) return netTime;
      const gunTime = parseLabeledTimeFromText(value, ["枪声成绩", "枪成绩", "枪声时间", "gun time", "gun"]);
      if (gunTime) return gunTime;
      const clock = value.match(/(?:成绩|净成绩|枪声成绩|完赛时间|用时|time)?[^\d]{0,10}(\d{1,2}):([0-5]\d):([0-5]\d)/i);
      if (clock) {
        const candidate = `${Number(clock[1])}:${clock[2]}:${clock[3]}`;
        const seconds = parseTime(candidate);
        if (seconds >= 2700 && seconds <= 36000) return candidate;
      }
      const chinese = value.match(/(\d{1,2})\s*(?:小时|时|h)\s*(\d{1,2})\s*(?:分|m)\s*(\d{1,2})?\s*(?:秒|s)?/i);
      if (chinese) {
        const candidate = `${Number(chinese[1])}:${pad2(chinese[2])}:${pad2(chinese[3] || 0)}`;
        const seconds = parseTime(candidate);
        if (seconds >= 2700 && seconds <= 36000) return candidate;
      }
      return "";
    }

    function escapeRegExp(text) {
      return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function parseRankFromText(text, labels) {
      const value = normalizeScoreText(text);
      const label = labels.map(escapeRegExp).join("|");
      const matched = value.match(new RegExp(`(?:${label})[^\\d]{0,18}(\\d{1,6})(?:\\s*/\\s*(\\d{2,6}))?`, "i"));
      if (!matched) return "";
      return matched[2] ? `${matched[1]} / ${matched[2]}` : matched[1];
    }

    function parseNetRankFromSection(text, sectionLabels) {
      const value = normalizeScoreText(text);
      const labelIndex = sectionLabels
        .map(label => value.toLowerCase().indexOf(label.toLowerCase()))
        .filter(index => index >= 0)
        .sort((a, b) => a - b)[0];
      if (labelIndex === undefined) return "";
      const section = value.slice(labelIndex, labelIndex + 220);
      const net = section.match(/(?:净计时成绩|净成绩|净计时|net time|net)[^\d]{0,24}(\d{1,6})\s*(?:名)?/i);
      if (net) return net[1];
      const gun = section.match(/(?:枪声成绩|枪成绩|gun time|gun)[^\d]{0,24}(\d{1,6})\s*(?:名)?/i);
      return gun ? gun[1] : "";
    }

    function parseOverallRankFromText(text) {
      return parseNetRankFromSection(text, ["全部选手排名", "全部排名", "总排名", "总名次", "OVERALL PLACE", "overall place", "overall"])
        || parseRankFromText(text, ["总排名", "总名次", "总成绩排名", "总成绩名次", "overall"]);
    }

    function parseGenderRankFromText(text) {
      return parseNetRankFromSection(text, ["性别排名", "性别名次", "GENDER PLACE", "gender place"])
        || parseRankFromText(text, ["性别排名", "性别名次", "男子排名", "男子名次", "女子排名", "女子名次", "男排名", "女排名", "gender", "male", "female"]);
    }

    function parseAgeRankFromText(text) {
      return parseRankFromText(text, ["年龄组排名", "年龄组名次", "年龄排名", "年龄名次", "分组排名", "分组名次", "组别排名", "组别名次", "age group", "age"]);
    }

    function parseBibNumberFromText(text) {
      const value = normalizeScoreText(text);
      const matched = value.match(/(?:参赛号码|参赛号|号码布|bib no\.?|bib number|bib)[^\w\u4e00-\u9fa5]{0,12}([A-Z]?\d{3,6})/i);
      return matched ? matched[1].toUpperCase() : "";
    }

    function parseElevationFromText(text) {
      const value = normalizeScoreText(text);
      const matched = value.match(/(?:累计爬升|总爬升|爬升|海拔增益|elevation gain|gain)[^\d]{0,18}(\d{1,5})\s*(?:m|米)?/i);
      return matched ? matched[1] : "";
    }

    function parseDistanceFromText(text, event) {
      const value = normalizeScoreText(text).toLowerCase();
      if (/半程|半马|half|21\.?0975?|21k/.test(value)) return "半马";
      if (/全程|全马|marathon|42\.?195|42k/.test(value)) return "全马";
      return event?.distance || "全马";
    }

    function parseOcrResult(text, fileName = "") {
      const normalized = normalizeScoreText(text);
      const event = selectBestEventMatch(normalized, fileName);
      const time = parseResultTimeFromText(normalized);
      const distance = parseDistanceFromText(normalized, event);
      return {
        event,
        distance,
        time,
        rank: parseOverallRankFromText(normalized),
        genderRank: parseGenderRankFromText(normalized),
        ageRank: parseAgeRankFromText(normalized),
        bibNumber: parseBibNumberFromText(normalized),
        elevationGain: parseElevationFromText(normalized),
        text: normalized
      };
    }

    function applyOcrResult(form, result) {
      if (result.event) {
        applyEventToReportForm(form, result.event);
        form.distance.value = result.distance || result.event.distance;
      } else if (result.distance && form.distance) {
        form.distance.value = result.distance;
      }
      if (result.time) {
        form.time.value = result.time;
        updateLevelFromForm(form);
      }
      if (result.rank) form.rank.value = result.rank;
      if (result.genderRank) form.genderRank.value = result.genderRank;
      if (result.ageRank) form.ageRank.value = result.ageRank;
      if (result.bibNumber && form.bibNumber) form.bibNumber.value = result.bibNumber;
      if (result.elevationGain && form.elevationGain) form.elevationGain.value = result.elevationGain;

      const found = [
        result.event ? result.event.city : "",
        result.time ? `成绩 ${result.time}` : "",
        result.rank ? `总排名 ${result.rank}` : "",
        result.genderRank ? `性别排名 ${result.genderRank}` : "",
        result.ageRank ? `年龄排名 ${result.ageRank}` : "",
        result.bibNumber ? `参赛号 ${result.bibNumber}` : "",
        result.elevationGain ? `爬升 ${result.elevationGain}m` : ""
      ].filter(Boolean);

      if (result.event) {
        setReportOcrStatus(form, "verified", `OCR 已识别：${found.join("，")}。保存前请确认字段无误。`);
        return;
      }
      if (result.time || result.rank || result.genderRank || result.ageRank) {
        setReportOcrStatus(form, "partial", `OCR 读到部分成绩信息：${found.join("，") || "未匹配赛事"}。请选择正确赛事后再保存。`);
        return;
      }
      setReportOcrStatus(form, "failed", "没有从图片里识别到赛事城市或成绩。请手动选择赛事、填写成绩后再保存。");
    }

    async function extractResultFromImage(file, form) {
      if (!file?.type?.startsWith("image/")) {
        setReportOcrStatus(form, "failed", "当前只支持图片成绩单 OCR，PDF 请手动填写。");
        return null;
      }
      setReportOcrStatus(form, "reading", "正在读取成绩单图片文字，可能需要十几秒...");
      try {
        const Tesseract = await ensureTesseract();
        const worker = await Tesseract.createWorker(["chi_sim", "eng"], 1, {
          logger(progress) {
            if (progress.status === "recognizing text" && progress.progress) {
              const percent = Math.round(progress.progress * 100);
              setReportOcrStatus(form, "reading", `正在识别成绩单文字 ${percent}%...`);
            }
          }
        });
        try {
          const ocrImage = await resizedImageBlobForOcr(file);
          const result = await worker.recognize(ocrImage, { rotateAuto: true });
          const parsed = parseOcrResult(result?.data?.text || "", file.name);
          applyOcrResult(form, parsed);
          return parsed;
        } finally {
          await worker.terminate();
        }
      } catch (error) {
        tesseractPromise = null;
        setReportOcrStatus(form, "failed", "OCR 服务暂时不可用。请手动选择赛事和成绩，不会再自动写入默认赛事。");
        return null;
      }
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("file_read_failed"));
        reader.readAsDataURL(file);
      });
    }

    function fileFingerprint(file) {
      return [file.name, file.size, file.lastModified].filter(value => value !== undefined).join("|");
    }

    function shouldAutoCutoutRunnerPhoto() {
      return true;
    }

    function dataUrlToBlob(dataUrl) {
      const source = String(dataUrl || "");
      const commaIndex = source.indexOf(",");
      const meta = commaIndex >= 0 ? source.slice(0, commaIndex) : "";
      const payload = commaIndex >= 0 ? source.slice(commaIndex + 1) : source;
      const mime = /data:([^;,]+)/.exec(meta)?.[1] || "image/jpeg";
      const binary = meta.includes(";base64") ? atob(payload) : decodeURIComponent(payload);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    function shouldQueueStoredRunnerPhotoCutout(runnerPhoto) {
      return Boolean(
        runnerPhoto?.dataUrl &&
        runnerPhoto.dataSource === "browser-original" &&
        !runnerPhoto.cutout &&
        !runnerPhoto.aiCutout &&
        !runnerPhoto.cutoutPending &&
        !runnerPhoto.cutoutFailedAt
      );
    }

    function maybeQueueStoredRunnerPhotoCutout(result) {
      const runnerPhoto = result?.assets?.runnerPhoto;
      if (!shouldAutoCutoutRunnerPhoto() || !shouldQueueStoredRunnerPhotoCutout(runnerPhoto)) return;
      if (activeStoredRunnerCutouts.has(result.id)) return;
      const fingerprint = runnerPhoto.fingerprint || [runnerPhoto.name, runnerPhoto.dataUrl.length].filter(Boolean).join("|");
      const nextName = runnerPhoto.name || "个人照片";
      runnerPhoto.name = nextName;
      runnerPhoto.cutoutPending = true;
      runnerPhoto.pendingFingerprint = fingerprint;
      activeStoredRunnerCutouts.add(result.id);
      persist().catch(() => {});
      window.setTimeout(async () => {
        try {
          const file = dataUrlToBlob(runnerPhoto.dataUrl);
          await processRunnerPhotoCutout(result.id, {
            file,
            fingerprint,
            nextName,
            hadExistingCutout: false
          });
        } finally {
          activeStoredRunnerCutouts.delete(result.id);
        }
      }, 300);
    }

    function imageFromDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("image_decode_failed"));
        image.src = dataUrl;
      });
    }

    async function compressImageForAsset(file, type) {
      const original = await fileToDataUrl(file);
      const image = await imageFromDataUrl(original);
      const maxSide = type === "medalImage" ? 920 : type === "runnerPhoto" ? 1200 : 1400;
      const quality = type === "medalImage" ? 0.86 : 0.78;
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      const scale = Math.min(1, maxSide / Math.max(width, height));
      if (scale >= 1 && file.size <= 1200 * 1024) return original;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", quality);
    }

    function canvasToBlob(canvas, mimeType, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("canvas_blob_failed")), mimeType, quality);
      });
    }

    function ensureCanvasConvertToBlob() {
      if (typeof HTMLCanvasElement === "undefined") return;
      if (typeof HTMLCanvasElement.prototype.convertToBlob === "function") return;
      HTMLCanvasElement.prototype.convertToBlob = function(options = {}) {
        return canvasToBlob(this, options.type || "image/png", options.quality);
      };
    }

    async function resizedImageBlobForModel(file) {
      const original = await fileToDataUrl(file);
      const image = await imageFromDataUrl(original);
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      const maxSide = 1280;
      const scale = Math.min(1, maxSide / Math.max(width, height));
      if (scale >= 1 && file.size <= 2400 * 1024) return file;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      const mimeType = file.type === "image/png" ? "image/png" : "image/jpeg";
      return canvasToBlob(canvas, mimeType, 0.88);
    }

    async function resizedImageBlobForOcr(file) {
      const original = await fileToDataUrl(file);
      const image = await imageFromDataUrl(original);
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      const maxSide = 1600;
      const scale = Math.min(1, maxSide / Math.max(width, height));
      if (scale >= 1 && file.size <= 1800 * 1024) return file;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvasToBlob(canvas, "image/jpeg", 0.84);
    }

    async function resizeDataUrl(dataUrl, maxSide, mimeType = "image/png", quality = 0.9) {
      const image = await imageFromDataUrl(dataUrl);
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      const scale = Math.min(1, maxSide / Math.max(width, height));
      if (scale >= 1) return dataUrl;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL(mimeType, quality);
    }

    function clampNumber(value, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    async function runnerCutoutBounds(dataUrl, alphaThreshold = 24) {
      const image = await imageFromDataUrl(dataUrl);
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, width);
      canvas.height = Math.max(1, height);
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = canvas.width;
      let minY = canvas.height;
      let maxX = -1;
      let maxY = -1;
      for (let y = 0; y < canvas.height; y += 1) {
        for (let x = 0; x < canvas.width; x += 1) {
          const alpha = pixels[(y * canvas.width + x) * 4 + 3];
          if (alpha <= alphaThreshold) continue;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      if (maxX < minX || maxY < minY) {
        return { x: 0, y: 0, width: canvas.width, height: canvas.height, sourceWidth: canvas.width, sourceHeight: canvas.height, usable: false };
      }
      const boxWidth = maxX - minX + 1;
      const boxHeight = maxY - minY + 1;
      const fillWidth = boxWidth / canvas.width;
      const fillHeight = boxHeight / canvas.height;
      return {
        x: minX,
        y: minY,
        width: boxWidth,
        height: boxHeight,
        sourceWidth: canvas.width,
        sourceHeight: canvas.height,
        fillWidth,
        fillHeight,
        centerX: (minX + boxWidth / 2) / canvas.width,
        centerY: (minY + boxHeight / 2) / canvas.height,
        usable: fillWidth > 0.12 && fillHeight > 0.28
      };
    }

    async function trimRunnerCutout(dataUrl) {
      const image = await imageFromDataUrl(dataUrl);
      const bounds = await runnerCutoutBounds(dataUrl);
      if (!bounds.usable) {
        return {
          dataUrl,
          runnerFit: { usable: false, scale: 1, x: "0%", y: "0%" }
        };
      }
      const padX = Math.round(bounds.width * 0.12);
      const padTop = Math.round(bounds.height * 0.08);
      const padBottom = Math.round(bounds.height * 0.04);
      const sx = Math.max(0, bounds.x - padX);
      const sy = Math.max(0, bounds.y - padTop);
      const sw = Math.min(bounds.sourceWidth - sx, bounds.width + padX * 2);
      const sh = Math.min(bounds.sourceHeight - sy, bounds.height + padTop + padBottom);
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, sw);
      canvas.height = Math.max(1, sh);
      const context = canvas.getContext("2d");
      context.drawImage(image, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const aspectRatio = canvas.width / canvas.height;
      const targetScale = clampNumber(aspectRatio < 0.48 ? 0.94 : aspectRatio > 0.72 ? 0.84 : 0.9, 0.78, 1);
      return {
        dataUrl: canvas.toDataURL("image/png", 0.92),
        runnerFit: {
          usable: true,
          scale: targetScale,
          x: "0%",
          y: "0%",
          aspectRatio: Number(aspectRatio.toFixed(3)),
          bounds: {
            width: bounds.width,
            height: bounds.height,
            sourceWidth: bounds.sourceWidth,
            sourceHeight: bounds.sourceHeight
          }
        }
      };
    }

    function posterExportCssText() {
      return [...document.styleSheets].map(sheet => {
        try {
          return [...sheet.cssRules].map(rule => rule.cssText).join("\n");
        } catch {
          return "";
        }
      }).join("\n");
    }

    function loadImageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("poster_export_image_failed"));
        image.src = url;
      });
    }

    async function downloadPosterPreview() {
      const target = document.querySelector(".poster-preview");
      if (!target) throw new Error("poster_preview_missing");
      const rect = target.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      const scale = 3;
      const clone = target.cloneNode(true);
      clone.style.width = `${width}px`;
      clone.style.height = `${height}px`;
      clone.style.maxWidth = "none";
      const styleText = `${posterExportCssText()}\n.poster-preview{width:${width}px!important;height:${height}px!important;max-width:none!important;}`;
      const html = `
        <div xmlns="http://www.w3.org/1999/xhtml">
          <style>${styleText}</style>
          ${clone.outerHTML}
        </div>
      `;
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
          <foreignObject width="100%" height="100%">${html}</foreignObject>
        </svg>
      `;
      const svgUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
      try {
        const image = await loadImageFromUrl(svgUrl);
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext("2d");
        context.scale(scale, scale);
        context.drawImage(image, 0, 0, width, height);
        const blob = await canvasToBlob(canvas, "image/png", 0.94);
        const posterUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = posterUrl;
        link.download = `marathon-poster-${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(posterUrl), 1500);
      } finally {
        URL.revokeObjectURL(svgUrl);
      }
    }

    async function ensureBackgroundRemoval() {
      ensureCanvasConvertToBlob();
      if (!backgroundRemovalPromise) {
        backgroundRemovalPromise = import(BG_REMOVAL_MODULE_URL);
      }
      const module = await backgroundRemovalPromise;
      if (typeof module.removeBackground !== "function") {
        throw new Error("background_removal_unavailable");
      }
      return module;
    }

    async function removeRunnerPhotoBackground(file) {
      const sourceBlob = await resizedImageBlobForModel(file);
      const { removeBackground } = await ensureBackgroundRemoval();
      const cutoutBlob = await removeBackground(sourceBlob, {
        publicPath: BG_REMOVAL_PUBLIC_PATH,
        model: "medium",
        output: { format: "image/png", quality: 0.92 }
      });
      const cutoutDataUrl = await fileToDataUrl(cutoutBlob);
      const resizedCutout = await resizeDataUrl(cutoutDataUrl, 1100, "image/png", 0.92);
      return trimRunnerCutout(resizedCutout);
    }

    async function readResultAssets(form, existingAssets = {}) {
      const assets = {};
      const cutoutJobs = [];
      const fields = [...form.querySelectorAll("[data-asset-file]")];
      for (const input of fields) {
        const file = input.files?.[0];
        if (!file) continue;
        const type = input.dataset.assetType;
        const fingerprint = fileFingerprint(file);
        let asset = { name: file.name, type: file.type || "image/*", fingerprint };
        const maxSize = type === "runnerPhoto" ? 12 * 1024 * 1024 : 8 * 1024 * 1024;
        if (file.type?.startsWith("image/") && file.size <= maxSize) {
          try {
            if (type === "runnerPhoto") {
              const existingRunnerPhoto = existingAssets.runnerPhoto;
              const autoCutout = shouldAutoCutoutRunnerPhoto();
              if (existingRunnerPhoto?.aiCutout && (existingRunnerPhoto.fingerprint === fingerprint || (!existingRunnerPhoto.fingerprint && existingRunnerPhoto.name === file.name))) {
                assets[type] = { ...existingRunnerPhoto, cutoutPending: false };
                continue;
              }
              if (existingRunnerPhoto?.aiCutout && autoCutout) {
                assets[type] = {
                  ...existingRunnerPhoto,
                  cutoutPending: true,
                  pendingName: file.name,
                  pendingFingerprint: fingerprint
                };
                cutoutJobs.push({
                  file,
                  fingerprint,
                  nextName: file.name,
                  previousName: existingRunnerPhoto.name,
                  hadExistingCutout: true
                });
                continue;
              }
              asset.dataUrl = await compressImageForAsset(file, type);
              asset.compressed = true;
              asset.cutout = false;
              asset.aiCutout = false;
              asset.cutoutPending = autoCutout;
              asset.dataSource = "browser-original";
              if (autoCutout) cutoutJobs.push({ file, fingerprint, nextName: file.name, hadExistingCutout: false });
            } else {
              asset.dataUrl = await compressImageForAsset(file, type);
              asset.compressed = true;
            }
          } catch {
            if (type === "runnerPhoto") {
              showToast("智能抠图未完成，已保留原图");
              try {
                asset.dataUrl = await compressImageForAsset(file, type);
                asset.compressed = true;
              } catch {
                if (file.size <= 1500 * 1024) asset.dataUrl = await fileToDataUrl(file);
              }
              asset.cutout = false;
              asset.aiCutout = false;
              asset.cutoutPending = false;
              asset.note = "智能抠图失败，已先保留原图";
            } else if (file.size <= 1500 * 1024) {
              asset.dataUrl = await fileToDataUrl(file);
            }
          }
        }
        if (!asset.dataUrl && file.size > maxSize) {
          asset.note = "图片较大，已先记录文件名";
        }
        assets[type] = asset;
      }
      return { assets, cutoutJobs };
    }

    async function processRunnerPhotoCutout(resultId, job) {
      try {
        const cutoutResult = await removeRunnerPhotoBackground(job.file);
        const cutoutDataUrl = cutoutResult.dataUrl;
        const index = db.results.findIndex(result => result.id === resultId);
        if (index < 0) return;
        const result = db.results[index];
        const current = result.assets?.runnerPhoto;
        if (!current) return;
        if (job.previousName && current.name !== job.previousName) return;
        if (!job.previousName && current.name !== job.nextName) return;
        if ((current.pendingFingerprint || current.fingerprint) && (current.pendingFingerprint || current.fingerprint) !== job.fingerprint) return;
        db.results[index] = {
          ...result,
          assets: {
            ...(result.assets || {}),
            runnerPhoto: {
              ...current,
              name: job.nextName,
              type: job.file.type || current.type || "image/*",
              fingerprint: job.fingerprint,
              dataUrl: cutoutDataUrl,
              compressed: true,
              cutout: true,
              aiCutout: true,
              cutoutPending: false,
              runnerFit: cutoutResult.runnerFit,
              pendingName: "",
              pendingFingerprint: "",
              dataSource: "browser-ai-cutout",
              model: "@imgly/background-removal@1.7.0"
            }
          },
          updatedAt: new Date().toISOString()
        };
        await persist();
        if (state.selectedResultId === resultId || ["archive", "poster"].includes(state.view)) render();
        showToast("个人照片抠图已完成");
      } catch {
        const index = db.results.findIndex(result => result.id === resultId);
        if (index < 0) return;
        const result = db.results[index];
        const current = result.assets?.runnerPhoto;
        if (!current) return;
        if (job.previousName && current.name !== job.previousName) return;
        if (!job.previousName && current.name !== job.nextName) return;
        db.results[index] = {
          ...result,
          assets: {
            ...(result.assets || {}),
            runnerPhoto: {
              ...current,
              cutout: job.hadExistingCutout ? current.cutout : false,
              aiCutout: job.hadExistingCutout ? current.aiCutout : false,
              cutoutPending: false,
              cutoutFailedAt: new Date().toISOString(),
              pendingName: "",
              pendingFingerprint: "",
              note: "智能抠图未完成，已先保留原图"
            }
          },
          updatedAt: new Date().toISOString()
        };
        await persist();
        if (state.selectedResultId === resultId || ["archive", "poster"].includes(state.view)) render();
        showToast("个人照片抠图未完成，已保留原图");
      }

      if (!db && view !== "loading") return;
      const push = options.push !== false;
      if (push && state.view !== view) state.history.push(state.view);
      state.view = view;
      if (["passport", "map", "archive", "community", "profile"].includes(view)) state.tab = view;
      render();
      screen.scrollTop = 0;

      const previous = state.history.pop();
      navigate(previous || state.tab || "passport", { push: false });

    function groupedCityResults(scope) {
      const source = scope === "sample" ? db.results : userResults();
      const grouped = new Map();
      source.forEach(result => {
        const event = resultEvent(result);
        if (!event) return;
        const item = grouped.get(result.city) || {
          city: result.city,
          lat: event.lat,
          lng: event.lng,
          count: 0,
          pb: false,
          official: false,
          best: result
        };
        item.count += 1;
        item.pb = item.pb || result.pb;
        item.official = item.official || result.official;
        if (result.seconds < item.best.seconds) item.best = result;
        grouped.set(result.city, item);
      });
      return [...grouped.values()];
    }

    function mapCitiesForCurrentFilter() {
      const sourceScope = state.mapFilter === "sample" ? "sample" : "mine";
      let cities = groupedCityResults(sourceScope);
      if (state.mapFilter === "pb") cities = cities.filter(city => city.pb);
      if (state.mapFilter === "official") cities = cities.filter(city => city.official);
      return cities;
    }

    function markerColor(city) {
      if (city.pb) return "#f36a17";
      if (city.official) return "#4b95ff";
      return "#d9b374";
    }

    function initMap() {
      const container = document.querySelector("#footprintMap");
      if (!container) return;
      destroyMap();
      const cities = mapCitiesForCurrentFilter();
      if (!cities.length) {
        container.innerHTML = `<div class="map-fallback">还没有足迹。添加一场完赛后，这里会点亮你的跑马城市。</div>`;
        return;
      }
      if (!window.L) {
        container.innerHTML = `<div class="map-fallback">地图控件加载中。当前已点亮 ${cities.length} 座城市。</div>`;
        return;
      }
      try {
        const isMobile = window.matchMedia("(max-width: 700px)").matches;
        footprintMap = L.map(container, {
          attributionControl: true,
          boxZoom: false,
          scrollWheelZoom: false,
          zoomControl: true
        }).setView(isMobile ? [32.5, 112.3] : [33.2, 112.8], isMobile ? 3.72 : 4.25);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          maxZoom: 18,
          minZoom: 3
        }).addTo(footprintMap);
        if (cities.length > 1) {
          routeLine = L.polyline(cities.map(city => [city.lat, city.lng]), {
            color: "#f36a17",
            dashArray: "8 10",
            lineCap: "round",
            opacity: 0.62,
            weight: 3
          }).addTo(footprintMap);
        }
        cities.forEach(city => {
          const size = 18 + Math.min(city.count, 6) * 2;
          const color = markerColor(city);
          const icon = L.divIcon({
            className: "",
            html: `<div class="footprint-marker" style="--marker-size:${size}px;--marker-color:${color}"><span class="marker-label">${safe(city.city)} ${city.count}</span></div>`,
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2],
            popupAnchor: [0, -size / 2]
          });
          L.marker([city.lat, city.lng], { icon })
            .addTo(footprintMap)
            .bindPopup(`<b>${safe(city.city)}</b><br>${safe(city.best.eventName)}<br>${safe([city.best.time, displayLevel(city.best.level)].filter(Boolean).join(" · "))}`);
        });
        setTimeout(() => footprintMap?.invalidateSize(), 60);
      } catch {
        container.innerHTML = `<div class="map-fallback">地图暂时没有渲染出来。当前已点亮 ${cities.map(city => safe(city.city)).join("、")}。</div>`;
      }
    }
