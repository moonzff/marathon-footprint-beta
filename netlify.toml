[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/report"
  to = "/docs/athlete-profile-report.html"
  status = 302

[[redirects]]
  from = "/beta"
  to = "/beta.html"
  status = 200

[[redirects]]
  from = "/u/:slug"
  to = "/beta.html"
  status = 200

[[redirects]]
  from = "/race/:id"
  to = "/beta.html"
  status = 200
